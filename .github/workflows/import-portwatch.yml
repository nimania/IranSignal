name: Import PortWatch historic maritime aggregates
on:
  schedule:
    - cron: '24 11 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transport-portwatch-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import attributed historical daily counts
        run: python scripts/import_portwatch.py
      - name: Recompute derived indicators
        run: |
          python scripts/analyze_transport.py
          python scripts/backtest_transport.py
      - name: Commit published aggregate observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transport/observations.csv data/transport/analysis.json data/transport/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh IMF PortWatch historic daily transit aggregates"
            git pull --rebase origin main
            git push
          fi

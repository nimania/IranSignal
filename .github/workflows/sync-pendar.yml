name: Sync Pendar evidence
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iransignal-pendar-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate Pendar evidence
        run: python scripts/sync_pendar.py
      - name: Commit changed evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pendar/
          if ! git diff --cached --quiet; then
            git commit -m "Sync Pendar evidence snapshot"
            git push
          fi

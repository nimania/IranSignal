name: Observe Polymarket expectations
on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iransignal-polymarket
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public market metadata
        run: python scripts/observe_polymarket.py
      - name: Store timestamped observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polymarket/
          if ! git diff --cached --quiet; then
            git commit -m "Archive Polymarket market expectations"
            git pull --rebase origin main
            git push
          fi

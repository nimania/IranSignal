name: Discover international news evidence
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iransignal-news-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover RSS candidates
        run: python scripts/discover_news.py
      - name: Commit candidates only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update international news evidence candidates"
            git pull --rebase origin main
            git push
          fi

name: Deploy IranSignal website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'daily/**'
      - 'fa/**'
      - 'scripts/**'
      - 'assets/**'
      - 'telegram/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Persian-only archive
        run: |
          mkdir -p _site
          cp -a fa _site/fa
          cp -a assets _site/assets
          mkdir -p _site/telegram
          cp telegram/editorial.json _site/telegram/editorial.json
          touch _site/.nojekyll
      - name: Generate Persian Telegram summaries
        run: |
          python3 scripts/build_telegram_daily.py
          cp -a telegram/daily _site/telegram/daily
      - name: Build simple Persian archive and sitemap
        run: python3 scripts/build_persian_archive.py
      - name: Validate Persian-only archive
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          root=Path('_site')
          manifest=json.loads((Path('daily/manifest.json')).read_text(encoding='utf-8'))
          expected=[r for r in manifest if r.get('status')=='published']
          assert (root/'index.html').is_file()
          assert (root/'fa/daily/index.html').is_file()
          assert not (root/'daily').exists(), 'English archive must not be published'
          assert (root/'telegram/daily/index.html').is_file()
          generated={p.name for p in (root/'telegram/daily').glob('*.txt')}
          expected_names={r['slug'].replace('/','--')+'.txt' for r in expected}
          assert generated==expected_names, ('Telegram editions mismatch', sorted(generated ^ expected_names))
          for r in expected:
              slug=r['slug']
              assert (root/'fa/daily'/slug/'index.html').is_file(), ('missing Persian report',slug)
              assert (root/'fa/daily'/slug/'full-transcript'/'index.html').is_file(), ('missing narration',slug)
          for page in root.rglob('*.html'):
              html=page.read_text(encoding='utf-8')
              assert 'iran-signal-fa-dashboard.js' not in html, page
              assert 'hreflang="en"' not in html, page
              assert '/IranSignal/daily/' not in html, page
          ElementTree.parse(root/'sitemap.xml')
          print('Persian-only archive validation passed:',len(expected),'daily reports')
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
